[package]
name = "rust-cargo-poc"
version = "0.0.0"
edition = "2021"
publish = false
description = "PoC — kiwa-test-rs v0.1 usage example (unit + integration tests covering setup_env / Mode / assert macros / mock_server). Part of the kiwa polyglot test framework family."

[lib]
name = "rust_cargo_poc"
path = "src/lib.rs"

[dependencies]
# Blocking HTTP client used by the PoC `UsersClient` domain wrapper that the
# integration test exercises through `kiwa::integration::mock_server`.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
kiwa-test-rs = { path = "../../kiwa-rs", version = "0.2" }
