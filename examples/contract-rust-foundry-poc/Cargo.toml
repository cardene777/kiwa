[package]
name = "contract-rust-foundry-poc"
version = "0.0.0"
edition = "2021"
publish = false
description = "PoC — kiwa-test-rs v0.4 contract::foundry integration example (forge / cast / anvil driven from Rust with graceful skip when Foundry CLI is missing). Part of the kiwa polyglot test framework family."

[lib]
name = "contract_rust_foundry_poc"
path = "src/lib.rs"

[dependencies]
kiwa-test-rs = { path = "../../kiwa-rs", version = "0.5", features = ["contract-foundry"] }
