[package]
name = "rust-actix-web-poc"
version = "0.0.0"
edition = "2021"
publish = false
description = "PoC — kiwa-test-rs v0.2 actix-web adapter usage example (Counter API + REST CRUD tests through kiwa::actix::test_app). Part of the kiwa polyglot test framework family."

[lib]
name = "rust_actix_web_poc"
path = "src/lib.rs"

[dependencies]
# actix-web is the framework we are integration-testing through kiwa. We
# disable default features so the example does not pull in the upstream
# `cookies` / `compress-*` features (cookie 0.16.2 × time 0.3.52 API drift in
# upstream, see kiwa-rs/Cargo.toml dev-dep note).
actix-web = { version = "4", default-features = false, features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
kiwa-test-rs = { path = "../../kiwa-rs", version = "0.5", features = ["actix-web"] }
