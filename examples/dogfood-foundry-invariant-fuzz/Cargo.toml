[package]
name = "dogfood-foundry-invariant-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
description = "Dogfood app (v1.18-3) — 3 Solidity contract (ERC-20 / Vault / Router) の Foundry invariant/fuzz drive を kiwa-test-rs contract::foundry::invariant で 10000 run + fuzz seed 決定的化 + shrink result assertion + coverage feed。 forge が PATH に無い host では graceful skip して trace に FOUNDRY_ENV_MISSING を刻む。 Feeds behavioural fidelity into @kiwa-test/quality-metrics."

[lib]
name = "dogfood_foundry_invariant_fuzz"
path = "src/lib.rs"

[dependencies]
kiwa-test-rs = { path = "../../kiwa-rs", version = "0.5", features = ["contract-foundry", "contract-alloy"] }
