# Foundry project descriptor for the v1.18-3 dogfood invariant/fuzz app.
#
# `[profile.default]` — plain `forge test` targets (unit / integration).
# `[invariant]` — invariant runner budget. The Rust harness overrode it
# per-invocation through `FOUNDRY_INVARIANT_RUNS` / `FOUNDRY_INVARIANT_SEED`;
# #1864 removed that harness, so the values below are what `forge test` uses.
# `[fuzz]` — stateless fuzz test budget. Same story with `FOUNDRY_FUZZ_RUNS` /
# `FOUNDRY_FUZZ_SEED`.
[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
# Stated rather than inferred, for the reason `dogfood-foundry-dapp` gives.
remappings = [
    "forge-std/=lib/forge-std/src/",
]

[invariant]
# The budget `forge test` uses. The v1.18-3 release gate ran 10_000 by having
# the kiwa harness set `FOUNDRY_INVARIANT_RUNS`; #1864 removed that harness, so
# nothing overrides this now and 256 is what actually runs.
runs = 256
depth = 15
fail_on_revert = false
call_override = false
dictionary_weight = 40
include_storage = true
include_push_bytes = true

[fuzz]
# Pinned so a failure can be reproduced. Without it every run explores a
# different sequence, and a counter-example found once cannot be re-run — which
# is the state #1864 left behind when it removed the harness that set
# `FOUNDRY_FUZZ_SEED`. The value is the one that harness used.
#
# `[invariant]` has no seed of its own and takes this one, so this single line
# pins both the stateless fuzz and the invariant runner. `forge config` echoes
# it only under `[fuzz]`, so the invariant half was checked by running instead:
# the same seed twice gives byte-identical output, and a different seed gives
# different output, which is what says the value reaches the runner rather than
# being carried and ignored.
#
# The cost is that a fixed seed explores the same sequences every time, so runs
# stop accumulating coverage. Raising `runs` is the way to widen the search;
# leaving the seed free would widen it too, but only by giving up the ability to
# reproduce anything it finds.
seed = "0xdeadbeefcafebabe"
runs = 256
max_test_rejects = 65536
dictionary_weight = 40
include_storage = true
include_push_bytes = true
