# Foundry project descriptor for the v1.18-3 dogfood invariant/fuzz app.
#
# `[profile.default]` — plain `forge test` targets (unit / integration).
# `[invariant]` — invariant runner budget. Overridden per-invocation by the
# `FOUNDRY_INVARIANT_RUNS` / `FOUNDRY_INVARIANT_SEED` env vars kiwa's
# `invariant_run` helper sets (see kiwa-rs/src/contract/foundry/invariant.rs).
# `[fuzz]` — stateless fuzz test budget. Same `FOUNDRY_FUZZ_RUNS` /
# `FOUNDRY_FUZZ_SEED` env override contract.
[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200

[invariant]
# Default budget when kiwa harness does not pin one via env. Real runs bump
# this to 10_000 for release-gate confidence — the base value here keeps
# local `forge test` cheap for iteration.
runs = 256
depth = 15
fail_on_revert = false
call_override = false
dictionary_weight = 40
include_storage = true
include_push_bytes = true

[fuzz]
# Same story — real runs use 10_000. The `seed` field is deliberately left
# out so `forge test` picks a fresh seed each iteration; kiwa's harness
# pins `FOUNDRY_FUZZ_SEED` at the run level for determinism.
runs = 256
max_test_rejects = 65536
dictionary_weight = 40
include_storage = true
include_push_bytes = true
