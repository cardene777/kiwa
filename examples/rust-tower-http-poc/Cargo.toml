[package]
name = "rust-tower-http-poc"
version = "0.0.0"
edition = "2021"
publish = false
description = "PoC — kiwa-test-rs v0.4 tower-http adapter usage example (axum Router + full 6 tower-http middleware chain through kiwa::tower_http::test_chain + intent-revealing helpers). Part of the kiwa polyglot test framework family."

[lib]
name = "rust_tower_http_poc"
path = "src/lib.rs"

[dependencies]
# axum is the framework the tower-http middleware chain sits on top of.
axum = { version = "0.8", default-features = false, features = ["json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
# `tower` drives the ServiceBuilder chain composed by the PoC and its tests.
tower = { version = "0.5", features = ["util"] }
# tower-http 0.6 supplies the six middleware helpers the PoC exercises. The
# feature set matches the kiwa `tower-http` feature so the PoC can build the
# real production chain (cors + trace + timeout + compression + auth + limit).
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "compression-gzip", "validate-request", "limit", "set-header", "auth"] }

[dev-dependencies]
kiwa-test-rs = { path = "../../kiwa-rs", version = "0.5", features = ["tower-http"] }
# `flate2` decodes the CompressionLayer output in the round-trip PoC test —
# the runtime crate itself only encodes, matching the kiwa-rs dev-dep pattern
# in `kiwa-rs/Cargo.toml`.
flate2 = "1"
# `base64` decodes the Basic auth header in the auth PoC test so the
# assertion round-trips the plaintext credential rather than hardcoding the
# base64 output (avoids secret-scanner false positives on repo grep).
base64 = "0.22"
