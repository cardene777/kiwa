[package]
name = "rust-axum-poc"
version = "0.0.0"
edition = "2021"
publish = false
description = "PoC — kiwa-test-rs v0.2 axum adapter usage example (Counter API + REST CRUD tests through kiwa::axum::test_app). Part of the kiwa polyglot test framework family."

[lib]
name = "rust_axum_poc"
path = "src/lib.rs"

[dependencies]
# axum is the framework we are integration-testing through kiwa.
axum = { version = "0.8", default-features = false, features = ["json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
kiwa-test-rs = { path = "../../kiwa-rs", version = "0.4", features = ["axum"] }
