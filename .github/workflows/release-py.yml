name: Release (Python — kiwa-test-py)

# Publish `kiwa-test-py` to PyPI when a `py-v*` tag is pushed (e.g. `py-v1.0.0`).
# Requires the repo to have a `PYPI_API_TOKEN` secret (User account → Account
# settings → API tokens → "Add API token", scope: "kiwa-test-py" only, then
# Repo settings → Secrets and variables → Actions → "New repository secret").
#
# Local dry-run before tagging:
#   cd kiwa-py && uv venv && uv pip install build twine && python -m build && twine check dist/*
#
# To publish from CLI manually instead of CI (after configuring `~/.pypirc`):
#   cd kiwa-py && python -m build && twine upload dist/*

on:
  push:
    tags:
      - 'py-v*'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write  # for PyPI trusted publishing if migrated later

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kiwa-test-py/
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest pytest-cov

      - name: Install package + test deps (editable)
        working-directory: kiwa-py
        run: |
          python -m pip install -e '.[dev,fastapi]'

      - name: Run pytest (fail the publish if tests don't pass)
        working-directory: kiwa-py
        run: pytest -ra

      - name: Build sdist + wheel
        working-directory: kiwa-py
        run: python -m build

      - name: Twine check
        working-directory: kiwa-py
        run: twine check dist/*

      - name: Publish to PyPI
        working-directory: kiwa-py
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
