name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry (for anvil)
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d  # v1.8.0
        with:
          version: stable

      - name: Verify anvil on PATH
        run: anvil --version

      - name: Build (spec first for type resolution)
        run: pnpm -F @kiwa-test/core build

      - name: Typecheck
        run: pnpm -F @kiwa-test/core -F @kiwa-test/dapp -F @kiwa-test/api -F @kiwa-test/ui -F @kiwa-test/data -F @kiwa-test/cli-test -F @kiwa-test/observability -F @kiwa-test/e2e -F @kiwa-test/cli -F @kiwa-test/a11y -F @kiwa-test/visual -F @kiwa-test/nextjs -F @kiwa-test/nuxt -F @kiwa-test/sveltekit -F @kiwa-test/remix -F @kiwa-test/astro -F @kiwa-test/solidstart -F @kiwa-test/qwikcity typecheck

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Test (spec)
        run: pnpm -F @kiwa-test/core test

      - name: Test (core)
        run: pnpm -F @kiwa-test/dapp test

      - name: Test (api)
        run: pnpm -F @kiwa-test/api test

      - name: Test (ui)
        run: pnpm -F @kiwa-test/ui test

      - name: Test (data)
        run: pnpm -F @kiwa-test/data test

      - name: Test (cli-test)
        run: pnpm -F @kiwa-test/cli-test test

      - name: Test (observability)
        run: pnpm -F @kiwa-test/observability test

      - name: Test (e2e)
        run: pnpm -F @kiwa-test/e2e test

      - name: Test (cli)
        run: pnpm -F @kiwa-test/cli test

      - name: Test (a11y)
        run: pnpm -F @kiwa-test/a11y test

      - name: Test (visual)
        run: pnpm -F @kiwa-test/visual test

      - name: Test (nextjs)
        run: pnpm -F @kiwa-test/nextjs test

      - name: Test (nuxt)
        run: pnpm -F @kiwa-test/nuxt test

      - name: Test (sveltekit)
        run: pnpm -F @kiwa-test/sveltekit test

      - name: Test (remix)
        run: pnpm -F @kiwa-test/remix test

      - name: Test (astro)
        run: pnpm -F @kiwa-test/astro test

      - name: Test (solidstart)
        run: pnpm -F @kiwa-test/solidstart test

      - name: Test (qwikcity)
        run: pnpm -F @kiwa-test/qwikcity test

      - name: Coverage (all 18 packages)
        run: pnpm -F @kiwa-test/core -F @kiwa-test/api -F @kiwa-test/ui -F @kiwa-test/data -F @kiwa-test/cli-test -F @kiwa-test/observability -F @kiwa-test/e2e -F @kiwa-test/cli -F @kiwa-test/dapp -F @kiwa-test/a11y -F @kiwa-test/visual -F @kiwa-test/nextjs -F @kiwa-test/nuxt -F @kiwa-test/sveltekit -F @kiwa-test/remix -F @kiwa-test/astro -F @kiwa-test/solidstart -F @kiwa-test/qwikcity --no-bail run test:cov

      - name: Coverage gate (fail if any package < 90/80/90/90)
        run: node scripts/check-coverage-gates.mjs

      - name: Mutation (all 18 packages)
        run: pnpm -F @kiwa-test/core -F @kiwa-test/api -F @kiwa-test/ui -F @kiwa-test/data -F @kiwa-test/cli-test -F @kiwa-test/observability -F @kiwa-test/e2e -F @kiwa-test/cli -F @kiwa-test/dapp -F @kiwa-test/a11y -F @kiwa-test/visual -F @kiwa-test/nextjs -F @kiwa-test/nuxt -F @kiwa-test/sveltekit -F @kiwa-test/remix -F @kiwa-test/astro -F @kiwa-test/solidstart -F @kiwa-test/qwikcity --no-bail run test:mutation

      - name: Mutation gate (fail if any package MSI < per-package threshold)
        run: node scripts/check-mutation-gates.mjs

      - name: Test (release-smoke)
        run: pnpm -F kiwa-release-smoke test

      - name: Build
        run: pnpm -F @kiwa-test/core -F @kiwa-test/dapp -F @kiwa-test/api -F @kiwa-test/ui -F @kiwa-test/data -F @kiwa-test/cli-test -F @kiwa-test/observability -F @kiwa-test/e2e -F @kiwa-test/cli -F @kiwa-test/a11y -F @kiwa-test/visual -F @kiwa-test/nextjs -F @kiwa-test/nuxt -F @kiwa-test/sveltekit -F @kiwa-test/remix -F @kiwa-test/astro -F @kiwa-test/solidstart -F @kiwa-test/qwikcity build

      - name: Typecheck consumer (examples)
        run: pnpm -F examples-basic-connect typecheck

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d  # v1.9.0
        with:
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
