name: Test (Bun runtime)

# Verify that all @kiwa-test/* packages run correctly under Bun (https://bun.sh)
# in addition to the default Node.js 22+ baseline. Bun installs project deps with
# pnpm (kept identical to the Node.js workflow) and then runs each package's
# Vitest suite via `bunx --bun vitest run` so the JavaScript runtime executing
# the tests is Bun, not Node.
#
# This is a kiwa v1.2 milestone deliverable (Issue #520) — separate from the
# main release.yml gate so a Bun regression doesn't block Node.js publish.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test-bun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 10.33.2

      - name: Setup Node.js (for pnpm install only)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Bun on PATH
        run: bun --version

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build all 19 packages (tsup outputs ESM + CJS + DTS)
        run: pnpm -F @kiwa-test/core -F @kiwa-test/dapp -F @kiwa-test/api -F @kiwa-test/ui -F @kiwa-test/data -F @kiwa-test/cli-test -F @kiwa-test/observability -F @kiwa-test/e2e -F @kiwa-test/cli -F @kiwa-test/a11y -F @kiwa-test/visual -F @kiwa-test/nextjs -F @kiwa-test/nuxt -F @kiwa-test/sveltekit -F @kiwa-test/remix -F @kiwa-test/astro -F @kiwa-test/solidstart -F @kiwa-test/qwikcity -F @kiwa-test/edge build

      - name: Run Vitest under Bun for every package
        run: |
          set -e
          for pkg in core api ui data cli-test observability e2e cli a11y visual nextjs nuxt sveltekit remix astro solidstart qwikcity edge; do
            echo "=== @kiwa-test/$pkg ==="
            (cd packages/$pkg && bunx --bun vitest run --no-watch)
          done

      - name: Bun-specific surface smoke (ESM import shape)
        run: |
          set -e
          (cd tests/release-smoke && bunx --bun vitest run --no-watch tests/import-surface.test.ts || true)
        # release-smoke is wired for Node by default; this step is informational
        # (|| true) until we add a dedicated bun-release-smoke worktree (#525).
