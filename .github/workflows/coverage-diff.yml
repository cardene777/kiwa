name: Coverage diff

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/post-coverage-diff.mjs'
      - 'scripts/check-coverage-gates.mjs'
      - '.github/workflows/coverage-diff.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry (for anvil)
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d  # v1.8.0
        with:
          version: stable

      - name: Build (spec first)
        run: pnpm -F @kiwa-test/core build

      - name: Capture baseline from main
        run: |
          git fetch origin main:_main_for_diff
          git checkout _main_for_diff
          pnpm install --frozen-lockfile
          pnpm -F @kiwa-test/core build
          pnpm -F @kiwa-test/core -F @kiwa-test/api -F @kiwa-test/data -F @kiwa-test/cli-test -F @kiwa-test/observability -F @kiwa-test/cli -F @kiwa-test/dapp -F @kiwa-test/ui -F @kiwa-test/e2e --no-bail run test:cov || true
          node scripts/post-coverage-diff.mjs --capture > /tmp/coverage-baseline.json
          git checkout -

      - name: Re-run coverage on PR head
        run: |
          pnpm install --frozen-lockfile
          pnpm -F @kiwa-test/core build
          pnpm -F @kiwa-test/core -F @kiwa-test/api -F @kiwa-test/data -F @kiwa-test/cli-test -F @kiwa-test/observability -F @kiwa-test/cli -F @kiwa-test/dapp -F @kiwa-test/ui -F @kiwa-test/e2e --no-bail run test:cov

      - name: Build coverage diff markdown
        run: node scripts/post-coverage-diff.mjs --baseline /tmp/coverage-baseline.json > /tmp/coverage-diff.md

      - name: Post comment to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/coverage-diff.md
