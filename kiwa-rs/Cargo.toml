[package]
name = "kiwa-test-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "kiwa Rust cargo test adapter — port of @kiwa-test/core deterministic fixture + assert macro + Drop-based cleanup. Part of the kiwa polyglot test framework family (https://github.com/cardene777/kiwa)."
license = "MIT"
authors = ["cardene <cardene777@gmail.com>"]
repository = "https://github.com/cardene777/kiwa"
homepage = "https://github.com/cardene777/kiwa"
documentation = "https://docs.rs/kiwa-test-rs"
readme = "README.md"
keywords = ["kiwa", "testing", "fixture", "cargo", "assert"]
categories = ["development-tools::testing"]

[lib]
name = "kiwa"
path = "src/lib.rs"

[features]
default = []
# proc-macro support (#[kiwa_test] attribute) — enabled via separate kiwa-test-rs-macro crate planned in v0.2
macro = []

[dependencies]

[dev-dependencies]
