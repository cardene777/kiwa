[package]
name = "kiwa-test-rs"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
description = "kiwa Rust cargo test adapter — deterministic fixture + assert macro + Drop-based cleanup + hyper mock server + axum Router test app + actix-web App test app + tower-http middleware chain helper. Part of the kiwa polyglot test framework family (https://github.com/cardene777/kiwa)."
license = "MIT"
authors = ["cardene <cardene777@gmail.com>"]
repository = "https://github.com/cardene777/kiwa"
homepage = "https://github.com/cardene777/kiwa"
documentation = "https://docs.rs/kiwa-test-rs"
readme = "README.md"
keywords = ["kiwa", "testing", "fixture", "cargo", "assert"]
categories = ["development-tools::testing"]

[lib]
name = "kiwa"
path = "src/lib.rs"

[features]
default = ["integration"]
# Integration test helpers (hyper-based mock server + request recorder).
# Pulls in hyper / hyper-util / tokio / http-body-util / bytes; users that only
# need unit fixtures can opt out with `default-features = false`.
integration = [
  "dep:hyper",
  "dep:hyper-util",
  "dep:http-body-util",
  "dep:tokio",
  "dep:bytes",
  "dep:http",
]
# axum Router test adapter — `kiwa::axum::test_app(router)` drives the Router
# in-process through `tower::Service::oneshot`, no real port bind needed. Opt-in
# because not every kiwa-test-rs user pulls in axum.
axum = [
  "dep:axum",
  "dep:tower",
  "dep:http",
  "dep:http-body-util",
  "dep:bytes",
  "dep:tokio",
  "dep:serde_json",
]
# actix-web App test adapter — `kiwa::actix::test_app(factory)` drives the App
# in-process through `actix_web::test::call_service`. Opt-in because not every
# kiwa-test-rs user pulls in actix-web (and its actix-rt runtime).
actix-web = [
  "dep:actix-web",
  "dep:actix-http",
  "dep:bytes",
  "dep:serde_json",
]
# tower-http middleware chain test adapter — `kiwa::tower_http::test_chain(layers, router)`
# drives a `ServiceBuilder<...>` layer stack layered on top of an axum `Router`
# through the same in-process `oneshot` path as the axum adapter. Opt-in
# because not every kiwa-test-rs user runs middleware regression tests.
# The tower-http crate itself is pulled in by dev-dependencies (v0.7.x) —
# this feature only unlocks the `kiwa::tower_http` module by turning on the
# axum adapter contract that it wraps. The middleware `Layer<S>` bounds are
# expressed via the `tower::Layer` trait already pulled in by the axum feature.
tower-http = [
  "axum",
  "dep:base64",
  "dep:tower-http",
]
# Foundry contract-testing integration — drives `forge` / `cast` / `anvil` via
# subprocess with a Drop-based `Anvil` handle and a coverage-report parser.
# Pulls no new dependencies (subprocess plumbing lives in `std::process`),
# only gates the `kiwa::contract::foundry` module. Requires the Foundry CLI
# on PATH at runtime; when absent, helpers return `skipped` outputs so test
# suites can skip gracefully in CI without provisioning the toolchain.
contract-foundry = []

# alloy.rs (Solidity ABI 型生成 + signer + provider) integration — pure Rust
# helper for parsing Foundry ABI JSON into a `SolAbi` shape, computing 4-byte
# function selectors via a built-in keccak-256 implementation, and
# enumerating the four signer / three provider paths kiwa users test
# against. Does NOT pull the alloy crate family (30+ MiB transitive tree);
# users who want the `sol!`-generated Rust structs pull the alloy crates
# themselves and consume this module's `SolAbi` output as input to their
# alloy setup.
# v0.5 adds `alloy::helpers` — EIP-712 typed data builder, Multicall3 batch
# encoder, and Permit2 PermitWitnessTransferFrom encoder. Same principle:
# pure Rust, no alloy crate dependency; consumers plug the encoded bytes
# into whichever Provider they build outside kiwa.
contract-alloy = []

# Reth (Rust Ethereum Execution client) integration — subprocess wrapper
# around `reth node --dev` with a Drop-based `RethNode` handle, a helper
# for N-block reorg simulation through the standard `anvil_reorg` /
# `debug_setHead` JSON-RPC methods (which reth exposes in dev mode), and
# a fidelity-comparison surface enumerating the RPC methods where anvil
# and reth are expected to agree. Requires the `reth` CLI on PATH at
# runtime; when absent, helpers return `skipped` outputs so test suites
# can skip gracefully in environments without the toolchain provisioned.
# Pulls no new dependencies — subprocess plumbing lives in `std::process`
# and the JSON-RPC payloads are hand-encoded strings so kiwa-test-rs does
# not gain the alloy transport crate tree.
contract-reth = []

# proc-macro support (#[kiwa_test] attribute) — enabled via separate kiwa-test-rs-macro crate planned in v0.3
macro = []

[dependencies]
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync", "macros", "time"], optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
axum = { version = "0.8", default-features = false, features = ["json", "tokio"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
# Used by `TestResponse::json()` — pulled in only when the axum / actix-web feature is on.
serde_json = { version = "1", optional = true }
# actix-web 4.x — opt-in via the `actix-web` feature. `actix-http` is pulled in
# directly so the adapter can name `actix_http::body::MessageBody` in its
# `test_app<F, B>` bound without re-exporting the trait through `actix-web`.
actix-web = { version = "4", default-features = false, features = ["macros"], optional = true }
actix-http = { version = "3", default-features = false, optional = true }
# base64 backs `kiwa::tower_http::auth::with_basic(user, pass)` — the helper
# formats `Basic <base64(user:pass)>` at call time so tests can attach the
# header without pulling a base64 crate into their own dev-dep matrix. Kept
# optional + gated behind the `tower-http` feature so consumers who do not
# opt into tower-http do not pay for it.
base64 = { version = "0.22", optional = true }
# tower-http itself — opt-in via the `tower-http` feature. Named as an
# optional runtime dep (not a dev-dep) because the 6 middleware helpers
# (cors / trace / compression / auth / rate_limit / timeout) reference
# `CorsLayer` / `TimeoutLayer` / `TraceLayer` / `CompressionLayer` type
# names in their public signatures — the AC 1 requirement in Issue #623.
# The feature set matches the middleware surface the helpers expose.
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "compression-gzip", "validate-request", "limit", "set-header", "auth"], optional = true }

[dev-dependencies]
# Sync HTTP client for blocking integration tests against `kiwa::integration::mock_server`.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# axum adapter tests construct Router with json / query / path handlers.
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "query", "matched-path"] }
# actix-web adapter tests construct App with json / query / path handlers. We
# disable default features so the dev-dep tree does not pull `actix-web`'s
# `cookies` feature (which transitively breaks on `cookie 0.16.2` × `time 0.3.52`
# upstream API drift). `macros` + `compress-*` are not required by our tests.
actix-web = { version = "4", default-features = false, features = ["macros"] }
# `tower` drives the middleware chain adapter tests; `ServiceBuilder` lives
# in `tower::ServiceBuilder`. `tower-http` itself is an optional lib dep
# (see [dependencies]) so `cargo test --features tower-http` picks it up
# transitively — the middleware helper tests reach `CorsLayer` /
# `TimeoutLayer` / `TraceLayer` / `CompressionLayer` /
# `ValidateRequestHeaderLayer` / `RequestBodyLimitLayer` through the lib
# feature set without a separate dev-dep declaration.
tower = { version = "0.5", features = ["util", "limit"] }
# `flate2` decodes the CompressionLayer output in the compression helper
# tests — tower-http itself only encodes. The read-side dev-dep stays
# scoped to test code so no runtime consumer pays for it.
flate2 = "1"
# `base64` is available at the runtime dep layer through the `tower-http`
# feature (see [dependencies]), but the auth helper test wants the same
# `base64::engine::general_purpose::STANDARD` in a decode-only context.
# Naming it as a dev-dep keeps the intent obvious in tests and avoids
# feature-gate cross-talk when the runtime dep is re-organised.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
